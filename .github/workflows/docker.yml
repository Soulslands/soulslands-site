name: Docker image

# Checks that the production image builds (linux/amd64) on every push to main and every pull request.
# arm64 (the Raspberry Pi image, cross-compiled) is on demand: "Run workflow" with arm64 ticked.
# This repository is public, so GitHub-hosted runners are free (ADR-0035 section 12).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build linux/arm64 (slow, cross-compiled)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform "$PLATFORMS" -t soulslands-web .
        env:
          PLATFORMS: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
