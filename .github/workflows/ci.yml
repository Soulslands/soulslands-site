name: CI

# Build, tests and browser tests. The Docker image build is in docker.yml.
# This repository is public, so GitHub-hosted runners are free (ADR-0035 section 12).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A folder the runner user owns, so setup-dotnet never needs /usr/share/dotnet. Set in a step because
      # the runner context is not available in a job-level env (GitHub rejects the whole file).
      - run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  # Browser tests (Playwright, headless Chromium) of the devlog and benchmark pages and of every page at phone width.
  # Kept out of Soulslands.slnx so build-and-test needs no browser. Chromium is installed with the node bundled in
  # the Playwright package (no pwsh, no sudo).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Soulslands.Web.E2E
      - name: Install Chromium
        working-directory: tests/Soulslands.Web.E2E/bin/Debug/net10.0
        run: .playwright/node/linux-x64/node .playwright/package/cli.js install chromium
      - run: dotnet test tests/Soulslands.Web.E2E --no-build

  # The static site for Cloudflare Pages (W-21): scripts/build-static.sh writes dist/ (it fails on a staff
  # page, a link without a file, a staff name or a server-only part in dist/), then the browser smoke test
  # runs over that dist/ served like Cloudflare Pages (tests/Soulslands.Web.E2E/serve-static.py).
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: scripts/build-static.sh
      - name: No server parts, no cookies in dist
        run: |
          # "! grep" would not stop a step under bash -e, hence the if.
          if grep -rl "Accedi\|Esci\|/Account/\|/Admin/\|/Server\|/wiki/modifica\|/cronologia\|Preferenze\|__Host-Soulslands" dist --include=*.html; then exit 1; fi
          if grep -rl "document.cookie" dist; then exit 1; fi
          test -f dist/index.html && test -f dist/404.html && test -f dist/_redirects && test -f dist/_headers
      - run: dotnet build tests/Soulslands.Web.E2E
      - name: Install Chromium
        working-directory: tests/Soulslands.Web.E2E/bin/Debug/net10.0
        run: .playwright/node/linux-x64/node .playwright/package/cli.js install chromium
      - run: dotnet test tests/Soulslands.Web.E2E --no-build --filter "FullyQualifiedName~StaticSiteE2ETests"
        env:
          STATIC_DIST: ${{ github.workspace }}/dist
